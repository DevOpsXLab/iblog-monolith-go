# Local development stack. Not used in CI/CD.
#
#   cp .env.example .env
#   docker compose up -d --build           # infra + migrate + api + worker
#   docker compose --profile dev run --rm seed   # demo data, once
#   docker compose down                    # stop (add -v to wipe data)
#
# App settings come from .env; the environment: blocks below only override
# what must differ inside the compose network (service names, not localhost).
# Infra ports bind to 127.0.0.1 only, on the same host ports .env uses, so
# `go run ./cmd/app` on the host keeps working against this stack.

name: iblog

x-app-env: &app-env
  DATABASE_URL: postgres://blog:blog@postgres:5432/blog?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: minio:9000
  SMTP_ADDR: mailpit:1025
  MIGRATE_ON_START: "false" # the migrate service owns schema changes

x-app: &app
  env_file: .env
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  # ---------- infra ----------
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio:latest # upstream stopped publishing minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001" # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:8025:8025" # web UI; SMTP 1025 stays on the compose network
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- app ----------
  # One-shot: app + Guard schema and access seed, then exits 0.
  migrate:
    build:
      context: .
      target: migrate
    image: iblog-migrate:dev
    env_file: .env
    environment: *app-env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    <<: *app
    build:
      context: .
      target: api
    image: iblog-api:dev
    environment:
      <<: *app-env
      WORKER: "false" # jobs run in the worker service
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  worker:
    <<: *app
    build:
      context: .
      target: worker
    image: iblog-worker:dev
    environment:
      <<: *app-env
      METRICS_ADDR: ":9090" # worker -healthcheck needs this listener

  # Dev-only demo data. Not started by `up`; run it once:
  #   docker compose --profile dev run --rm seed
  seed:
    profiles: ["dev"]
    build:
      context: .
      target: seed
    image: iblog-seed:dev
    env_file: .env
    environment:
      SEED_API: http://api:${PORT:-8080}
      SEED_DATABASE_URL: postgres://blog:blog@postgres:5432/blog?sslmode=disable
      SEED_REDIS_URL: redis://redis:6379/0
    restart: "no"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
