name: go-vuln

# Reusable: govulncheck, reports only CVEs reachable from our code and fails on one.
on:
  workflow_call:
    inputs:
      packages: { type: string, default: ./..., description: Go packages to check }
      go-version-file: { type: string, default: go.mod, description: file setup-go reads the Go version from }
      runner: { type: string, default: ubuntu-24.04, description: runner label }
      timeout-minutes: { type: number, default: 10, description: job timeout }

permissions:
  contents: read

jobs:
  vuln:
    name: Vulnerability check
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: ${{ inputs.go-version-file }}
          go-package: ${{ inputs.packages }}
