name: image-build

# Reusable: builds every Dockerfile stage in `targets`.
# artifact: false -> build check only (CI). artifact: true -> save each image as
# a tarball artifact <app-name>-<target> for scan and push (CD).
# No environment, no secrets: build steps never see tokens.
on:
  workflow_call:
    inputs:
      targets: { type: string, required: true, description: 'JSON array of Dockerfile stages, e.g. ["api","worker"]' }
      app-name: { type: string, required: true, description: local image and artifact prefix }
      version: { type: string, default: dev, description: "VERSION build-arg (main.version, OCI label); commit is always github.sha" }
      artifact: { type: boolean, default: false, description: save each image as a tarball artifact }
      fail-fast: { type: boolean, default: false, description: cancel other targets when one fails }
      context: { type: string, default: ., description: docker build context }
      retention-days: { type: number, default: 1, description: artifact retention }
      runner: { type: string, default: ubuntu-24.04, description: runner label }
      timeout-minutes: { type: number, default: 20, description: job timeout }

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      # Same cache scope in CI and CD: CD's build after merge is mostly cache hits.
      - name: Docker build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          target: ${{ matrix.target }}
          push: false
          # Dockerfile: -X main.version/main.commit + org.opencontainers.image.{version,revision}.
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ github.sha }}
          tags: ${{ inputs.app-name }}-${{ matrix.target }}:${{ github.sha }}
          outputs: ${{ inputs.artifact && format('type=docker,dest={0}/{1}.tar', runner.temp, matrix.target) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Upload image
        if: inputs.artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app-name }}-${{ matrix.target }}
          path: ${{ runner.temp }}/${{ matrix.target }}.tar
          retention-days: ${{ inputs.retention-days }}
