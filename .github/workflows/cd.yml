name: CD
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
      - dev
concurrency:
  # PRs: drop stale runs. main/dev pushes: never kill a run mid-build/publish.
  cancel-in-progress: false
  group: "cd-${{ github.event.workflow_run.head_branch }}"
permissions:
  contents: read
jobs:
  build:
    name: Build (${{ matrix.target }})
    if : ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        target: ${{ fromJSON(github.event.workflow_run.head_branch == 'main' && '["api","worker","migrate"]' || '["api","worker","migrate","seed"]') }}
    steps:
      - uses: actions/checkout@v7
